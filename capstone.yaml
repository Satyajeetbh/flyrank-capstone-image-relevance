name: flyrank-capstone-image-relevance
project: FlyRank AI Image Understanding & Content Matching Engine
language: typescript
runtime: node

verification:
  build: npm run build
  typecheck: npm run typecheck
  database: docker compose up -d postgres

persistence:
  database: postgresql
  extensions:
    - vector
  embedding_model: gemini-embedding-2
  embedding_dimension: 1536

run:
  infrastructure: docker compose up -d postgres redis
  api: npm start
  worker: npm run worker:image-processing

seed:
  corpus: node --env-file=.env scripts/process-image-corpus.mjs

test:
  unit: npm run test:unit
  integration: npm run test:integration
  evaluation: npm run test:evaluation

base_url: http://localhost:3000

endpoints:
  image_ingestion: POST /images
  post_images: GET /posts/:id/images
  suggestion: GET /suggestions/:id
  approve_suggestion: POST /suggestions/:id/approve
  reject_suggestion: POST /suggestions/:id/reject

evaluation:
  labeled_data: data/evaluation/labeled-posts.json
  retrieval: npm run evaluate:retrieval
  calibration: npm run evaluate:retrieval:calibrate

scope: stage-18-complete-engine
